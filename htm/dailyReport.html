<!doctype html>

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <link rel="stylesheet" href="../assets/css/menu.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/daily-report.css">
    <title data-i18n="daily_page_title">日盈利汇总</title>
  </head>
  <body class="daily-report-page">
    <header class="header-container daily-report-header">
      <div class="header-box">
        <a href="/">
          <img src="../assets/images/logo.png" alt="KAOLA Bubble Tea Logo" class="logo" style="width: auto; height: 80px;">
        </a>
        <button class="mobile-nav-toggle" type="button" aria-label="打开导航菜单" data-i18n-aria-label="open_navigation" aria-expanded="false" aria-controls="dailyNavigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="header-nav-links" id="dailyNavigation">
          <a href="/" data-i18n="home">首页</a>
          <a href="/htm/menu.html" data-i18n="menu">菜单</a>
          <a href="/htm/about" data-i18n="about">关于我们</a>
          <a href="#contact" data-i18n="contact">联系我们</a>
          <select id="langSwitch" class="lang-switch" aria-label="Language Switcher">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="sr">Srpski</option>
          </select>
        </nav>
      </div>
    </header>
    <div class="daily-box">
      <a href="/">
        <img src="../assets/images/daily.png" alt="KAOLA Bubble Tea Logo" class="logo">
      </a>
      <form id="dailyForm" class="daily-form">
        <label>
          <strong><em class="required">*</em> <span data-i18n="daily_turnover">票额</span>:</strong>
          <span class="currency-input">
            <input data-i18n-placeholder="daily_turnover_placeholder" placeholder="当日总票额（包含Wolt）" id="votes" required>
            <em>DIN</em>
          </span>
        </label>
        <label>
          <strong><em class="required">*</em> <span data-i18n="daily_cash">现金</span>:</strong>
          <span class="currency-input">
            <input data-i18n-placeholder="daily_cash_placeholder" placeholder="包含欧元或美金" id="cash" required>
            <em>DIN</em>
          </span>
        </label>
        <label>
          <strong><span data-i18n="daily_wolt">Wolt外卖</span>:</strong>
          <span class="currency-input">
            <input data-i18n-placeholder="daily_wolt_placeholder" placeholder="实际金额（非平台金额）" id="wolt" >
            <em>DIN</em>
          </span>
        </label>
        <label>
          <strong><span data-i18n="daily_qr_payment">扫码支付</span>:</strong>
          <span class="currency-input">
            <input data-i18n-placeholder="daily_qr_placeholder" placeholder="微信或支付宝" id="rmb" >
            <em class="currency-rmb">RMB</em>
          </span>
        </label>
        <label>
          <strong><span data-i18n="daily_other_payment">其它支付</span>:</strong>
          <span class="currency-input">
            <input data-i18n-placeholder="daily_other_placeholder" placeholder="扫码或本地币转账等" id="other" >
            <em>DIN</em>
          </span>
        </label>
        <label>
          <strong><span data-i18n="daily_expense">消费支出</span>:</strong>
          <span class="currency-input">
            <input data-i18n-placeholder="daily_expense_placeholder" placeholder="餐补和物料采购等" id="consume" >
            <em>DIN</em>
          </span>
        </label>
        <label>
          <strong><span data-i18n="daily_material">物料购入</span>:</strong>
          <span class="currency-input">
            <input data-i18n-placeholder="daily_material_placeholder" placeholder="请输入物料购入" id="material" >
          </span>
        </label>
        <label>
          <strong><span data-i18n="remark">备注</span>:</strong>
          <textarea data-i18n-placeholder="daily_remark_placeholder" placeholder="请输入备注" id="remark"></textarea>
        </label>
        <div class="daily-actions">
          <button class="submit-btn calculate-btn" id="calculateDaily" type="button" data-i18n="calculate">计算</button>
          <button class="submit-btn submit-daily-btn" type="submit" data-i18n="submit">提交</button>
        </div>
        <p class="daily-result" id="dailyResult" aria-live="polite" data-i18n="daily_result_tip">输入【票额】和【现金】开始计算</p>
      </form>
    </div>
    <div class="daily-loading" id="dailyLoading" aria-hidden="true">
      <div class="daily-loading-box">
        <span class="daily-spinner"></span>
        <p data-i18n="submitting">提交中，请稍候...</p>
      </div>
    </div>

    <footer class="footer-container" id="contact">
      <div class="footer-box">
        <img src="../assets/images/logo.png" alt="KAOLA Bubble Tea Logo" class="footer-logo" style="width: auto; height: 120px;">

          <a href="https://www.facebook.com/share/1eYa3f3ZNT/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="social-link facebook" aria-label="Facebook"></a>
          <a href="https://www.tiktok.com/@kaolabubbletea?_r=1&_t=ZS-97fzIjCoIbw" target="_blank" rel="noopener noreferrer" class="social-link tiktok" aria-label="TikTok"></a>
          <a href="https://wa.me/message/E3PIYL2X2SPFN1" target="_blank" rel="noopener noreferrer" class="social-link whatsapp" aria-label="WhatsApp"></a>
          <a href="https://invite.viber.com/?g2=AQASZejnvCaReVay22AlJNkH965hZ67J2LVqYAL73SnJddt9aaEtZOX9dOJsNAfz" target="_blank" rel="noopener noreferrer" class="social-link2 viber" aria-label="Viber"></a>
        </div>
        <div class="contant-txt">
          <p data-i18n="contact_us" class="title">Contact us</p>

        </div>
      </div>
      <p class="footer-txt">&copy; <span class="current-year">2026</span> KAOLA Bubble Tea. All rights reserved.<br><span class="footer-since">Since 2024</span></p>
    </footer>

    <script src="../assets/js/config.js"></script>

      document.querySelector('.current-year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
