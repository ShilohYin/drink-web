<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="../assets/css/menu.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/daily-report.css">
    <title>日盈利汇总</title>
    <style>
      .daily-box {
        padding-top: 80px;
        display: flex;
        width: 1200px;
        margin: 0 auto;
      }

      .daily-box form {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="daily-box">
      <a href="/">
        <img src="../assets/images/daily.png" alt="KAOLA Bubble Tea Logo" class="logo" style="width: 504px;">
      </a>
      <form id="dailyForm" class="daily-form">
        <label>
          <strong><em class="required">*</em> 票  额:</strong>
          <span class="currency-input">
            <input placeholder="当日总票额（包含wolt）" id="votes" required>
            <em>DIN</em>
          </span>
        </label>
        <label>
          <strong><em class="required">*</em> 现  金:</strong>
          <span class="currency-input">
            <input placeholder="包含欧元或美金" id="cash" required>
            <em>DIN</em>
          </span>
        </label>
        <label>
          <strong>Wolt外卖:</strong>
          <span class="currency-input">
            <input placeholder="实际金额（非平台金额）" id="wolt" >
            <em>DIN</em>
          </span>
        </label>
        <label>
          <strong>消费支出:</strong>
          <span class="currency-input">
            <input placeholder="餐补和物料采购等" id="consume" >
            <em>DIN</em>
          </span>
        </label>
        <label>
          <strong>扫码支付:</strong>
          <span class="currency-input">
            <input placeholder="微信或支付宝" id="rmb" >
            <em class="currency-rmb">RMB</em>
          </span>
        </label>
        <label>
          <strong>其它支付:</strong>
          <span class="currency-input">
            <input placeholder="退款，本地币转账等" id="other" >
            <em>DIN</em>
          </span>
        </label>
        <label>
          <strong>物料购入:</strong>
          <span class="currency-input">
            <input placeholder="请输入物料购入" id="material" >
          </span>
        </label>
        <label>
          <strong>备注:</strong>
          <textarea placeholder="请输入备注" id="remark"></textarea>
        </label>
        <div class="daily-actions">
          <button class="submit-btn calculate-btn" id="calculateDaily" type="button">计算</button>
          <button class="submit-btn submit-daily-btn" type="submit">提交</button>
        </div>
        <p class="daily-result" id="dailyResult" aria-live="polite"></p>
      </form>
    </div>
    <div class="daily-loading" id="dailyLoading" aria-hidden="true">
      <div class="daily-loading-box">
        <span class="daily-spinner"></span>
        <p>提交中，请稍候...</p>
      </div>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/daily.js"></script>
  </body>
</html>
