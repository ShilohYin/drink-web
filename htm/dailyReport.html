<!doctype html>

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="../assets/css/header.css">
    <link rel="stylesheet" href="../assets/css/menu.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/daily-report.css">
    <title>日盈利汇总</title>
    <style>
      .daily-box {
        padding-top: 160px;
        display: flex;
        min-width: 1200px;
        margin: 0 auto;
        width: 92%;
      }

      .daily-box form {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header class="header-container daily-report-header">
      <div class="header-box">
        <a href="/">
          <img src="../assets/images/logo.png" alt="KAOLA Bubble Tea Logo" class="logo" style="width: auto; height: 80px;">
        </a>
        <nav class="header-nav-links">
          <a href="/" data-i18n="home">首页</a>
          <a href="/htm/menu.html" data-i18n="menu">菜单</a>
          <a href="/htm/about" data-i18n="about">关于我们</a>
          <a href="#contact" data-i18n="contact">联系我们</a>
          <select id="langSwitch" class="lang-switch" aria-label="Language Switcher">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="sr">Srpski</option>
          </select>
        </nav>
      </div>
    </header>
    <div class="daily-box">
      <a href="/">
        <img src="../assets/images/daily.png" alt="KAOLA Bubble Tea Logo" class="logo">
      </a>
      <form id="dailyForm" class="daily-form">
        <label>
          <strong><em class="required">*</em> 票  额:</strong>
          <span class="currency-input">
            <input placeholder="当日总票额（包含wolt）" id="votes" required>
            <em>DIN</em>
          </span>
        </label>
        <label>
          <strong><em class="required">*</em> 现  金:</strong>
          <span class="currency-input">
            <input placeholder="包含欧元或美金" id="cash" required>
            <em>DIN</em>
          </span>
        </label>
        <label>
          <strong>Wolt外卖:</strong>
          <span class="currency-input">
            <input placeholder="实际金额（非平台金额）" id="wolt" >
            <em>DIN</em>
          </span>
        </label>
        <label>
          <strong>扫码支付:</strong>
          <span class="currency-input">
            <input placeholder="微信或支付宝" id="rmb" >
            <em class="currency-rmb">RMB</em>
          </span>
        </label>
        <label>
          <strong>其它支付:</strong>
          <span class="currency-input">
            <input placeholder="扫码或本地币转账等" id="other" >
            <em>DIN</em>
          </span>
        </label>
        <label>
          <strong>消费支出:</strong>
          <span class="currency-input">
            <input placeholder="餐补和物料采购等" id="consume" >
            <em>DIN</em>
          </span>
        </label>
        <label>
          <strong>物料购入:</strong>
          <span class="currency-input">
            <input placeholder="请输入物料购入" id="material" >
          </span>
        </label>
        <label>
          <strong>备注:</strong>
          <textarea placeholder="请输入备注" id="remark"></textarea>
        </label>
        <div class="daily-actions">
          <button class="submit-btn calculate-btn" id="calculateDaily" type="button">计算</button>
          <button class="submit-btn submit-daily-btn" type="submit">提交</button>
        </div>
        <p class="daily-result" id="dailyResult" aria-live="polite">输入【票额】和【现金】开始计算</p>
      </form>
    </div>
    <div class="daily-loading" id="dailyLoading" aria-hidden="true">
      <div class="daily-loading-box">
        <span class="daily-spinner"></span>
        <p>提交中，请稍候...</p>
      </div>
    </div>

    <footer class="footer-container" id="contact">

        </div>
        <div class="contant-txt">
