<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Menu</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/menu.css" />
  </head>
  <body>
    <header>
      <a class="logo" href="/">
        <img src="/assets/images/logo.png" alt="KAOLA Bubble Tea Logo" class="logo" style="width: auto; height: 80px;">
      </a>
      <nav class="nav-menu">
        <a href="/">首页</a>
        <a class="active">菜单</a>
        <a href="/htm/about">关于我们</a>
        <a href="/">联系我们</a>
      </nav>
      <div class="header-right">
        <select id="langSwitch" class="lang-switch">
          <option value="zh">CN</option>
          <option value="en">EN</option>
          <option value="sr">SR</option>
        </select>
        <button id="cartToggle" class="cart-icon" aria-label="Shopping cart">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span id="cartCount" class="cart-badge">0</span>
        </button>
      </div>
    </header>
    <main>
      <div id="products" class="products-container"></div>
      <aside id="cart" class="cart-panel">
        <h2 data-i18n="cart">购物车</h2>
        <div id="cartItems"></div>
        <p id="total"></p>
        <button id="openCheckout" class="checkout-button" type="button" data-i18n="checkout">结账</button>
        <p class="cart-image-note">图片仅供参考</p>
      </aside>
    </main>

    <div class="selection-modal" id="selectionModal" aria-hidden="true">
      <div class="selection-modal-overlay" id="selectionOverlay"></div>
      <div class="selection-modal-content">
        <button class="modal-close-btn" id="closeSelectionModal" aria-label="Close selection">×</button>
        <h2 id="selectionTitle">选择配置</h2>
        <p class="selection-price" id="selectionPrice"></p>
        <div class="size-selector" id="sizeSelector" aria-label="选择杯型" hidden>
          <button type="button" class="size-option active" data-size="L">L</button>
          <button type="button" class="size-option" data-size="M">M</button>
        </div>
        <form id="selectionForm">
          <label>
            小料
            <select id="selectionTopping"></select>
          </label>
          <label>
            冰度
            <select id="selectionIce"></select>
          </label>
          <label>
            甜度
            <select id="selectionSugar"></select>
          </label>
          <div class="modal-actions">
            <button type="button" class="secondary-btn" id="cancelSelection">取消</button>
            <button type="submit" class="submit-btn">加入购物车</button>
          </div>
        </form>
      </div>
    </div>

    <div class="checkout-modal" id="checkoutModal" aria-hidden="true">
      <div class="checkout-modal-overlay" id="checkoutOverlay"></div>
      <div class="checkout-modal-content">
        <button class="modal-close-btn" id="closeCheckoutModal" aria-label="Close checkout form">×</button>
        <h2 data-i18n="checkout">Checkout</h2>
        <form id="checkoutForm">
          <label>
            <strong><span data-i18n="name">姓名</span><em class="required">*</em></strong>
            <input placeholder="请输入您的姓名" id="name" required>
          </label>
          <label>
            <strong><span data-i18n="phone">电话</span><em class="required">*</em></strong>
            <input placeholder="请输入您的电话" id="phone" required>
          </label>
          <div class="checkout-choice-row">
            <strong>取餐方式</strong>
            <div class="checkout-radio-group" role="radiogroup" aria-label="取餐方式">
              <label class="checkout-radio-option">
                <input type="radio" name="deliveryType" value="自取" checked>
                <span>自取</span>
              </label>
              <label class="checkout-radio-option">
                <input type="radio" name="deliveryType" value="配送">
                <span>配送</span>
              </label>
            </div>
          </div>
          <label>
            <strong>地址</strong>
            <input placeholder="配送仅支持欧亚" id="address">
          </label>
          <label>
            <strong data-i18n="remark">备注 </strong>
            <textarea placeholder="请输入备注信息" id="remark"></textarea>
          </label>
          <div class="modal-actions">
            <button class="submit-btn" type="submit">Submit</button>
          </div>
        </form>
      </div>
    </div>
    <div class="checkout-loading" id="checkoutLoading" aria-hidden="true">
      <div class="checkout-loading-box">
        <span class="checkout-spinner"></span>
        <p>提交中，请稍候...</p>
      </div>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/checkout.js"></script>
    <script type="module" src="../assets/js/menu.js"></script>
  </body>
</html>
